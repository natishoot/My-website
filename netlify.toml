[build]
  publish = "."

# Site en construction : noindex sur toutes les pages (retiré au lancement).
# robots.txt reste ouvert pour que Google puisse lire ce noindex et le fichier de validation Search Console.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
